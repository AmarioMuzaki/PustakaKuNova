<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login | PustakaKU Nova</title>
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="login">
      <div class="intro">
        <h1>📚 PustakaKU Nova</h1>
        <h2>Selamat datang kembali!</h2>
        <p>Kelola perpustakaan dengan cara yang lebih modern.</p>
        <a href="index.html">← Kembali</a>
      </div>
      <form id="form">
        <div class="icon">🔐</div>
        <h2>Masuk ke Aplikasi</h2>
        <label>Username<input id="user" required /></label
        ><label>Password<input id="pass" type="password" required /></label
        ><label
          >Role<select id="role">
            <option>admin</option>
            <option>anggota</option>
          </select></label
        ><button>Masuk Sekarang →</button>
        <p id="msg"></p>
        <small>Demo: admin/12345 atau anggota/12345</small>
      </form>
    </div>
    <script src="js/auth.js"></script>
  </body>
</html>
